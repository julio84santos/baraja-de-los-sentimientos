name: One-time UTM passthrough fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/utm-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject UTM forwarding into Hotmart links
        shell: python
        run: |
          from pathlib import Path

          page = Path('index.html')
          text = page.read_text(encoding='utf-8')
          marker = """<script>
          (function () {
            if (typeof fbq === 'undefined') return;"""

          tracking_script = """<!-- UTMIFY_PASSTHROUGH_V1 -->
          <script>
          (function () {
            var params = new URLSearchParams(window.location.search);
            if (!params.toString()) return;

            var commonTrackingKeys = ['fbclid', 'gclid', 'ttclid', 'kwai_click_id', 'src', 'sck'];

            document.querySelectorAll('a[href*=\"pay.hotmart.com\"]').forEach(function (link) {
              try {
                var checkoutUrl = new URL(link.href);

                params.forEach(function (value, key) {
                  if (key.indexOf('utm_') === 0 || commonTrackingKeys.indexOf(key) !== -1) {
                    checkoutUrl.searchParams.set(key, value);
                  }
                });

                link.href = checkoutUrl.toString();
              } catch (e) {
                console.warn('No fue posible preservar los parámetros de seguimiento.', e);
              }
            });
          })();
          </script>

          """

          if 'UTMIFY_PASSTHROUGH_V1' not in text:
              if marker not in text:
                  raise SystemExit('Marker not found; index.html was not changed')
              text = text.replace(marker, tracking_script + marker, 1)
              page.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/utm-fix.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit tracking fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Fix UTM passthrough to Hotmart checkout"
          git push
